name: Build and Release koboldcpp

on:
  push:
    branches: [ 'concedo', 'add-koboldcpp-release-binary' ]
  workflow_dispatch:

env:
  KCPP_CUDA: 12.1.0
  ARCHES_CU12: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions: write-all
    container:
      image: ubuntu:20.04
      options: --privileged
    outputs:
      artifact-name: kcpp_linux_binary
    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v4

      - name: Show Commit Used
        run: |
          echo "Building from ref: ${{ github.head_ref || github.ref_name }}"

      - name: Dependencies
        id: depends
        run: |
          apt-get update
          apt-get install -y sudo
          export DEBIAN_FRONTEND=noninteractive
          sudo ln -fs /usr/share/zoneinfo/UTC /etc/localtime
          echo "tzdata tzdata/Areas select Etc" | sudo debconf-set-selections
          echo "tzdata tzdata/Zones/Etc select UTC" | sudo debconf-set-selections
          sudo apt-get -y install git curl bzip2 python3-tk tcl tk

      - name: Build
        id: make_build
        run: |
          ./koboldcpp.sh dist

      - name: Verify binary exists
        run: |
          ls -lh dist/
          file dist/koboldcpp-linux-x64*

      - name: Rename file before upload
        run: |
          if [ -f "dist/koboldcpp-linux-x64-cuda"* ]; then
            mv dist/koboldcpp-linux-x64-cuda* dist/koboldcpp-linux-x64
          fi
          ls -lh dist/koboldcpp-linux-x64

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: kcpp_linux_binary
          path: dist/koboldcpp-linux-x64*

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: kcpp_linux_binary

      - name: List artifacts
        run: ls -lh

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "koboldcpp-${{ github.sha }}" \
            --repo "${{ github.repository }}" \
            --title "koboldcpp ${{ github.sha }}" \
            --notes "Automated build from commit ${{ github.sha }}. Includes qwen3-tts Vulkan performance fix (avoid unnecessary ggml_cast to F32)." \
            koboldcpp-linux-x64* \
            || gh release upload "koboldcpp-${{ github.sha }}" koboldcpp-linux-x64* --clobber --repo "${{ github.repository }}"
